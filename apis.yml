aid: new-york-life
name: New York Life
description: >-
  New York Life Insurance Company is the largest mutual life insurance
  company in the United States, headquartered in Manhattan, New York. The
  company provides life insurance, fixed and variable annuities, long-term
  care, and investment management (through subsidiaries such as New York
  Life Investments / NYLIM). New York Life has maintained the highest
  financial-strength ratings from major rating agencies for more than a
  century. No public developer portal or external APIs have been identified;
  agent, partner, and reinsurer integrations occur through private B2B
  channels.
